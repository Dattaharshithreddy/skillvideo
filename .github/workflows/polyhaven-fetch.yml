name: Poly Haven fetch (CC0 textures + HDRIs)
on:
  push:
    branches: [reels/follow-the-sugar]
    paths: [tools/terrain/polyhaven.json]
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install -q huggingface_hub
          python3 tools/terrain/polyhaven.py /tmp/ph "$(cat tools/terrain/polyhaven.json)"
          du -sh /tmp/ph; find /tmp/ph -type f | head -60
          python3 -c "from huggingface_hub import HfApi;HfApi().sync_bucket('/tmp/ph','hf://buckets/HarshithReddy05/tirumala-reel/varaha/ph',quiet=True);print('uploaded')"
